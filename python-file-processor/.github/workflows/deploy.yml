name: Deploy

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Repository
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download build artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });
            
            for (const artifact of artifacts.data.artifacts) {
              console.log(`Found artifact: ${artifact.name}`);
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });
            }

      - name: Upload artifacts to release
        run: |
          echo "Deployment artifacts available"
          echo "To publish to PyPI, ensure PYPI_API_TOKEN is configured in repository secrets"

      - name: Create deployment status
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ github.event.workflow_run.id }},
              state: 'success',
              description: 'Deployment completed successfully'
            }).catch(() => console.log('Deployment status update skipped'));
